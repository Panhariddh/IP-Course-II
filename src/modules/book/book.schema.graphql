# src/modules/booking/booking.schema.graphql
type Booking {
  id: ID!
  start_date: String!
  end_date: String!
  hotel_id: ID!
  is_checked_in: Boolean!
  price: Float!
}

type Query {
  bookings(startDate: String!, endDate: String!): [Booking]
}

type Mutation {
  bookHotel(hotel_id: ID!, start_date: String!, end_date: String!, price: Float!): Booking
  cancelBooking(id: ID!): Booking
  checkIn(id: ID!): Booking
}